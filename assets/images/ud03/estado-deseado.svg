<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Bucle de reconciliación"><rect x="0" y="0" width="760" height="236" rx="14" fill="#f5f8fa"/><text x="380" y="32" text-anchor="middle" font-size="18" fill="#1d2a36" font-weight="700">La idea de Kubernetes: declaras el estado deseado</text><rect x="70" y="70" width="220" height="70" rx="7" fill="#e6f3f6" stroke="#0b6e8a" stroke-width="1.5"/><text x="180" y="100" text-anchor="middle" font-size="14" fill="#0b6e8a" font-weight="700">DESEADO</text><text x="180" y="122" text-anchor="middle" font-size="13" fill="#0b6e8a">3 réplicas</text><rect x="470" y="70" width="220" height="70" rx="7" fill="#fff4e6" stroke="#b9770e" stroke-width="1.5"/><text x="580" y="100" text-anchor="middle" font-size="14" fill="#b9770e" font-weight="700">REAL</text><text x="580" y="122" text-anchor="middle" font-size="13" fill="#b9770e">2 réplicas</text><rect x="300" y="78" width="160" height="54" rx="7" fill="#eaf4ec" stroke="#1f7a3d" stroke-width="1.5"/><text x="380.0" y="110.25" text-anchor="middle" font-size="15" fill="#1f7a3d" font-weight="600">Controlador</text><text x="380" y="150" text-anchor="middle" font-size="12" fill="#5b6b77">compara sin parar</text><path d="M290 105 h8" stroke="#0b6e8a" stroke-width="2"/><path d="M460 105 h-8" stroke="#b9770e" stroke-width="2"/><path d="M380 132 v26 h-150 v24" stroke="#1f7a3d" stroke-width="2" fill="none" marker-end="url(#b)"/><rect x="160" y="182" width="140" height="40" rx="7" fill="#eaf4ec" stroke="#1f7a3d" stroke-width="1.5"/><text x="230.0" y="206.9" text-anchor="middle" font-size="14" fill="#1f7a3d" font-weight="600">crea 1 Pod</text><text x="380" y="210" text-anchor="middle" font-size="12" fill="#5b6b77">→ el estado real pasa a 3. Si borras un Pod, lo vuelve a crear. No das la orden: está en el deseado.</text><defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#1f7a3d"/></marker></defs></svg>