<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Service y Pods"><rect x="0" y="0" width="760" height="250" rx="14" fill="#f5f8fa"/><text x="380" y="32" text-anchor="middle" font-size="17" fill="#1d2a36" font-weight="700">Un Service: nombre e IP fijos para Pods que cambian</text><rect x="50" y="100" width="130" height="44" rx="7" fill="#eef1f3" stroke="#5b6b77" stroke-width="1.5"/><text x="115.0" y="126.9" text-anchor="middle" font-size="14" fill="#1d2a36" font-weight="600">Cliente</text><path d="M180 122 h70" stroke="#5b6b77" stroke-width="2" fill="none" marker-end="url(#c)"/><text x="300" y="98" text-anchor="middle" font-size="13" fill="#0b6e8a" font-weight="700">api  (IP fija)</text><rect x="250" y="104" width="150" height="52" rx="7" fill="#e6f3f6" stroke="#0b6e8a" stroke-width="1.5"/><text x="325.0" y="135.25" text-anchor="middle" font-size="15" fill="#0b6e8a" font-weight="600">Service</text><path d="M400 130 C460 130 470 88 520 88" stroke="#1f7a3d" stroke-width="2" fill="none" /><rect x="520" y="66" width="170" height="44" rx="7" fill="#eaf4ec" stroke="#1f7a3d" stroke-width="1.5"/><text x="605.0" y="92.55" text-anchor="middle" font-size="13" fill="#1f7a3d" font-weight="600">Pod listo</text><path d="M400 130 C460 130 470 146 520 146" stroke="#1f7a3d" stroke-width="2" fill="none" /><rect x="520" y="124" width="170" height="44" rx="7" fill="#eaf4ec" stroke="#1f7a3d" stroke-width="1.5"/><text x="605.0" y="150.55" text-anchor="middle" font-size="13" fill="#1f7a3d" font-weight="600">Pod listo</text><path d="M400 130 C460 130 470 204 520 204" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="5 4"/><rect x="520" y="182" width="170" height="44" rx="7" fill="#f6eaea" stroke="#c0392b" stroke-width="1.5"/><text x="605.0" y="208.55" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="600">Pod NO listo</text><text x="380" y="232" text-anchor="middle" font-size="12" fill="#5b6b77">El Service reparte solo entre los Pods listos (readiness). Si un Pod muere y nace otro, el nombre no cambia.</text><defs><marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#5b6b77"/></marker></defs></svg>