<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiTienda</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; color: #1d2a36; }
    h1 { color: #0b6e8a; } table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
    button { background: #0b6e8a; color: #fff; border: 0; padding: .35rem .8rem; border-radius: .3rem; cursor: pointer; }
    button:disabled { background: #9bb; cursor: default; }
    .pie { color: #667; font-size: .9rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>🛒 MiTienda</h1>
  <p>Catálogo de la tienda. Pulsa «Comprar» para llevarte una unidad.</p>
  <table>
    <thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr></thead>
    <tbody id="productos"><tr><td colspan="5">Cargando…</td></tr></tbody>
  </table>
  <p class="pie" id="pie"></p>
  <script>
    async function cargar() {
      const tb = document.getElementById('productos');
      try {
        const r = await fetch('/api/productos');
        if (!r.ok) throw new Error(r.status);
        const datos = await r.json();
        tb.innerHTML = datos.map(p =>
          `<tr><td>${p.nombre}</td><td>${p.categoria}</td><td>${p.precio.toFixed(2)} €</td><td>${p.stock}</td>
           <td><button onclick="comprar(${p.id})" ${p.stock ? '' : 'disabled'}>Comprar</button></td></tr>`).join('');
      } catch (err) {
        tb.innerHTML = `<tr><td colspan="5">No se puede contactar con la API (${err.message}).</td></tr>`;
      }
      try {
        const i = await (await fetch('/api/info')).json();
        const v = await (await fetch('/api/visitas')).json();
        document.getElementById('pie').textContent =
          `API v${i.version} · respondió el contenedor ${i.contenedor} · visitas: ${v.visitas ?? '—'}`;
      } catch (e) { /* la caché puede no estar disponible */ }
    }
    async function comprar(id) {
      const r = await fetch(`/api/comprar/${id}`, { method: 'POST' });
      if (!r.ok) alert((await r.json()).error);
      cargar();
    }
    cargar();
  </script>
</body>
</html>
