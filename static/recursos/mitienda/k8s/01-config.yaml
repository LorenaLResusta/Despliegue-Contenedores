# Configuración no secreta de la API. La contraseña va en un Secret que se crea a mano:
#   kubectl -n mitienda create secret generic db-cred --from-literal=password='CAMBIA_ESTO'
# El script SQL inicial se carga como ConfigMap:
#   kubectl -n mitienda create configmap db-init --from-file=init.sql=../db/init.sql
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: mitienda
data:
  DB_HOST: db
  DB_NAME: mitienda
  DB_USER: tienda
  REDIS_HOST: cache
  APP_VERSION: "1.0.0"
